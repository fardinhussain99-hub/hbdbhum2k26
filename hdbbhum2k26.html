<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>For BHUMIKA ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Georgia,serif;
    overflow-x:hidden;
    background:black;
    color:white;
    text-align:center;
}

/* PASSWORD SCREEN */

#lockScreen{

    position:fixed;

    inset:0;

    background:
    linear-gradient(
    135deg,
    #050505,
    #120010,
    #000000);

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    overflow:hidden;

    z-index:9999;
}

/* GLOW EFFECT */

#lockScreen::before{

    content:"";

    position:absolute;

    width:500px;
    height:500px;

    background:
    radial-gradient(circle,
    rgba(255,0,102,0.35),
    transparent 70%);

    animation:
    moveGlow 8s infinite alternate ease-in-out;
}

@keyframes moveGlow{

    from{
        transform:
        translate(-120px,-80px);
    }

    to{
        transform:
        translate(120px,80px);
    }
}

/* PASSWORD BOX */

.lock-box{

    position:relative;

    background:
    rgba(255,255,255,0.08);

    padding:35px 28px;

    border-radius:25px;

    backdrop-filter:blur(14px);

    width:min(320px,88vw);

    border:
    1px solid rgba(255,255,255,0.12);

    animation:
    boxGlow 2s infinite alternate;

    z-index:2;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;
}

@keyframes boxGlow{

    from{

        box-shadow:
        0 0 15px rgba(255,0,102,0.4);
    }

    to{

        box-shadow:
        0 0 35px rgba(255,0,102,0.9),
        0 0 70px rgba(255,77,109,0.6);
    }
}

.lock-box h2{

    margin-bottom:20px;

    color:#ff77a8;

    text-shadow:
    0 0 15px #ff0066;
}

.lock-box input{

    width:100%;

    padding:14px;

    border:none;

    outline:none;

    border-radius:12px;

    font-size:1em;

    text-align:center;

    margin-top:8px;
}

.lock-box button{

    margin-top:18px;

    padding:14px;

    border:none;

    border-radius:30px;

    background:#ff0066;

    color:white;

    cursor:pointer;

    font-size:1em;

    width:100%;

    box-shadow:
    0 0 15px #ff0066;
}

#wrong{

    margin-top:12px;

    color:#ffb3c7;
}

/* FULLSCREEN BACKGROUND */

/* =========================
FULLSCREEN BACKGROUND
========================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:

    linear-gradient(
    to bottom,
    rgba(0,0,0,.28),
    rgba(0,0,0,.78)
    ),

    url("https://github.com/fardinhussain99-hub/hbdbhum2k26/blob/main/Screenshot_2026-05-18-11-32-25-904_com.gallery.player.jpg.jpeg?raw=true");

    background-size:cover;

    background-repeat:no-repeat;

    background-position:center center;

    /* PERFORMANCE */

    will-change:transform;

    backface-visibility:hidden;

    transform-origin:center center;

    /* ULTRA SMOOTH ANIMATION */

    animation:
    smoothZoom 28s ease-in-out infinite;

    z-index:-2;
}

/* =========================
ULTRA SMOOTH ZOOM
========================= */

@keyframes smoothZoom{

    0%{

        transform:
        scale(1);
    }

    25%{

        transform:
        scale(1.05);
    }

    50%{

        transform:
        scale(1.10);
    }

    75%{

        transform:
        scale(1.05);
    }

    100%{

        transform:
        scale(1);
    }
}

/* =========================
MOBILE OPTIMIZATION
========================= */

@media(max-width:768px){

    body::before{

        animation:
        smoothZoomMobile 24s ease-in-out infinite;
    }

    @keyframes smoothZoomMobile{

        0%{

            transform:
            scale(1);
        }

        25%{

            transform:
            scale(1.06);
        }

        50%{

            transform:
            scale(1.14);
        }

        75%{

            transform:
            scale(1.06);
        }

        100%{

            transform:
            scale(1);
        }
    }
}
body::after{

    content:"";

    position:fixed;

    inset:0;

    background:
    radial-gradient(circle at top,
    rgba(255,77,109,.25),
    transparent 60%);

    z-index:-1;
}

/* CONTAINER */

.container{

    min-height:100vh;

    padding:25px 15px 90px;

    display:none;
}

/* HEADING */

h1{

    font-size:
    clamp(2.2em,6vw,4.3em);

    color:#ff77a8;

    margin-top:20px;

    line-height:1.3;

    animation:
    fadeDown 1.2s ease,
    glow 2s infinite alternate;
}

@keyframes glow{

    from{

        text-shadow:
        0 0 10px #ff0066,
        0 0 20px #ff0066,
        0 0 40px #ff3385;
    }

    to{

        text-shadow:
        0 0 20px #ff0066,
        0 0 40px #ff3385,
        0 0 70px #ff66a3;
    }
}

@keyframes fadeDown{

    from{

        opacity:0;

        transform:
        translateY(-40px);
    }

    to{

        opacity:1;

        transform:
        translateY(0);
    }
}

/* QUOTE */

.quote{

    margin:30px auto;

    font-size:
    clamp(1.05em,3vw,1.5em);

    width:94%;

    max-width:700px;

    color:#ffe4ec;

    line-height:1.9;

    min-height:120px;

    text-shadow:
    0 0 12px pink;
}

/* IMAGE */

.pic{

    width:80vw;

    max-width:330px;

    border-radius:22px;

    margin:20px auto;

    border:
    4px solid rgba(255,255,255,.3);

    box-shadow:
    0 0 25px rgba(255,77,109,.7),
    0 0 50px rgba(255,215,0,.4);

    animation:
    float 4s ease infinite;
}

@keyframes float{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0);
    }
}

/* COUNTDOWN */

.countdown{

    margin-top:30px;

    font-size:1.1em;

    color:#fff3b0;

    line-height:1.8;

    text-shadow:
    0 0 15px gold;
}

.date{

    margin-top:10px;

    font-size:1em;

    color:#ffd6e0;
}

/* BUTTON */

.music-btn{

    margin-top:28px;

    width:85vw;

    max-width:320px;

    padding:15px;

    border:none;

    border-radius:40px;

    font-size:1em;

    color:white;

    cursor:pointer;

    background:
    linear-gradient(
    135deg,
    #ff4d6d,
    #ff0066);

    box-shadow:
    0 0 15px rgba(255,0,85,.8);
}

.music-btn.playing{

    background:
    linear-gradient(
    135deg,
    #00c2ff,
    #0077ff);

    animation:
    pulse 1.2s infinite;
}

@keyframes pulse{

    50%{
        transform:scale(1.08);
    }
}

/* SNOW */

.snow{

    position:fixed;

    top:-10px;

    background:white;

    border-radius:50%;

    opacity:.8;

    animation:
    fall linear infinite;
}

@keyframes fall{

    to{
        transform:
        translateY(110vh);
    }
}

/* FOOTER */

.page-footer{

    position:fixed;

    bottom:8px;

    left:50%;

    transform:
    translateX(-50%);

    width:100%;

    font-size:.75em;

    color:#ffd6e0;

    padding:0 12px;

    line-height:1.5;
}

.page-footer a{

    color:#ff5d8f;

    text-decoration:none;
}

.page-footer img{

    width:15px;

    vertical-align:middle;

    margin-right:5px;
}

/* MOBILE */

@media(max-width:768px){

    #lockScreen::before{

        width:350px;
        height:350px;
    }

    .lock-box{

        width:88vw;

        padding:28px 22px;
    }

    body::before{

        animation:
        cinematicZoomMobile 18s ease-in-out infinite;
    }

    @keyframes cinematicZoomMobile{

        0%{
            transform:scale(1);
        }

        50%{
            transform:scale(1.18);
        }

        100%{
            transform:scale(1);
        }
    }
}
 /* FOOTER */
        .page-footer {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9em;
            color: #ffd6e0;
            opacity: 0.85;
            z-index: 10;
            text-align: center;
        }

        .page-footer a {
            color: #ff4d6d;
            text-decoration: none;
        }

        .page-footer img {
            width: 18px;
            vertical-align: middle;
            margin-right: 5px;
        }

</style>

</head>

<body>

<div id="lockScreen">

    <div class="lock-box">

        <h2>Enter Password ❤️</h2>

        <input
        type="password"
        id="pass"
        placeholder="Password">

        <button onclick="checkPass()">
            Unlock
        </button>

        <div id="wrong"></div>

    </div>

</div>

<div class="container"
id="mainContent">

    <h1>
        HAPPY BIRTHDAY, BHUMIKA ❤️
    </h1>

    <div class="quote"
    id="quote"></div>

    <img class="pic"
    src="https://github.com/fardinhussain99-hub/hbdbhum2k26/blob/main/IMG_20260518_113314.jpg.jpeg?raw=true">

    <div class="countdown"
    id="countdown"></div>

    <div class="date">
        🎂 17 MAY 🎂
    </div>

    <button class="music-btn"
    id="musicBtn">
        Play Music
    </button>

    <audio id="song" loop>

        <source
        src="AudioCutter_AudioSplit_Alan Walker, Dua Lipa, Coldplay, Martin Garrix & Kygo, Th.mp3">

    </audio>
<footer class="page-footer">
            Made with ❤️ by
            <a href="https://www.instagram.com/fardinhussain99" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/3955/3955024.png">
                @fardinhussain99
            </a>
        </footer>

</div>

<script>

/* =========================
TYPEWRITER TEXT
========================= */

const text =
"“Just like lights brighten the darkest nights, your presence makes the world warmer, softer, and happier.”";

let i = 0;

/* TYPEWRITER FUNCTION */

function typing(){

    if(i < text.length){

        document.getElementById("quote")
        .innerHTML += text.charAt(i);

        i++;

        setTimeout(typing,45);
    }
}

/* =========================
PASSWORD
========================= */

function checkPass(){

    const pass =
    document.getElementById("pass").value;

    if(pass === "17MAY"){

        /* HIDE PASSWORD SCREEN */

        document.getElementById("lockScreen")
        .style.display = "none";

        /* SHOW MAIN PAGE */

        document.getElementById("mainContent")
        .style.display = "block";

        /* START WRITING ANIMATION */

        document.getElementById("quote")
        .innerHTML = "";

        i = 0;

        typing();

    }else{

        document.getElementById("wrong")
        .textContent =
        "Wrong Password ❤️";
    }
}

/* =========================
MUSIC
========================= */

const audio =
document.getElementById("song");

const btn =
document.getElementById("musicBtn");

btn.onclick = () => {

    if(audio.paused){

        audio.play();

        btn.textContent =
        "Pause Music";

        btn.classList.add("playing");

    }else{

        audio.pause();

        btn.textContent =
        "Play Music";

        btn.classList.remove("playing");
    }
};

/* =========================
SNOW EFFECT
========================= */

function snow(){

    const s =
    document.createElement("div");

    s.className = "snow";

    const size =
    Math.random() * 5 + 3;

    s.style.width =
    size + "px";

    s.style.height =
    size + "px";

    s.style.left =
    Math.random() * 100 + "vw";

    s.style.animationDuration =
    (Math.random() * 3 + 2) + "s";

    document.body.appendChild(s);

    setTimeout(() =>
    s.remove(),6000);
}

setInterval(snow,140);

/* =========================
COUNTDOWN
========================= */

const countdown =
document.getElementById("countdown");

function updateCountdown(){

    const now = new Date();

    let target =
    new Date(now.getFullYear(),4,17);

    if(now > target){

        target =
        new Date(now.getFullYear()+1,4,17);
    }

    const diff =
    target - now;

    const d =
    Math.floor(diff / 86400000);

    const h =
    Math.floor(diff % 86400000 / 3600000);

    const m =
    Math.floor(diff % 3600000 / 60000);

    const s =
    Math.floor(diff % 60000 / 1000);

    countdown.textContent =
    `${d}d ${h}h ${m}m ${s}s left for 17 MAY ❤️`;
}

setInterval(updateCountdown,1000);

updateCountdown();

</script>

</body>
</html>
